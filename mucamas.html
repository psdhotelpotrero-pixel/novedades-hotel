<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mucamas - Registro de Novedades</title>

  <!-- Manifest para PWA -->
  <link rel="manifest" href="manifest-mucamas.json">
  <meta name="theme-color" content="#2563eb">

  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --success: #10b981;
    }

    html, body {
      width: 100% !important;
      max-width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow-x: hidden !important;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    * { box-sizing: border-box !important; margin: 0; padding: 0; }

    .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 8px; }

    header {
      margin-bottom: 10px; background: var(--card-bg); padding: 12px 10px;
      border-radius: 10px; border: 1px solid var(--border); text-align: center; width: 100%;
    }

    header h1 { font-size: 1.1rem; color: #1e293b; font-weight: 800; line-height: 1.2; }
    header small { display: block; margin-top: 4px; font-size: 0.75rem; color: #64748b; }

    .card { background: var(--card-bg); border-radius: 10px; padding: 12px; border: 1px solid var(--border); width: 100%; }
    .form-group { margin-bottom: 12px; width: 100%; }
    label { display: block; font-size: 0.72rem; font-weight: 800; color: #475569; margin-bottom: 4px; text-transform: uppercase; }

    input, select, textarea {
      width: 100% !important; display: block !important; padding: 10px !important;
      border: 1px solid var(--border) !important; border-radius: 6px !important;
      font-size: 16px !important; color: var(--text) !important; background: #ffffff !important;
      -webkit-appearance: none; appearance: none;
    }

    select {
      background-image: url('data:image/svg+xml;utf8,<svg fill="%23475569" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>') !important;
      background-repeat: no-repeat !important; background-position: right 8px center !important;
      background-size: 18px !important; padding-right: 28px !important;
    }

    textarea { resize: none; height: 90px; }

    .btn-submit {
      width: 100% !important; background-color: var(--primary); color: #ffffff;
      border: none; padding: 12px; border-radius: 6px; font-weight: 800;
      font-size: 0.95rem; cursor: pointer; margin-top: 4px;
    }
    .btn-submit:active { opacity: 0.85; }

    .alert-success {
      display: none; margin-top: 10px; padding: 10px; background: #dcfce7;
      color: #166534; border: 1px solid #86efac; border-radius: 6px; font-size: 0.8rem; font-weight: 700; text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🧹 Registro de Novedades</h1>
      <small>Mucamas — Control de Habitación</small>
    </header>

    <div class="card">
      <form id="formMucamas">
        
        <div class="form-group">
          <label for="mucamaNombre">Nombre de la Mucama:</label>
          <select id="mucamaNombre" required>
            <option value="">Seleccione su nombre...</option>
            <option value="Muñoz Luciana">Muñoz Luciana</option>
            <option value="La Borda Elisa">La Borda Elisa</option>
            <option value="Lucero Mónica">Lucero Mónica</option>
            <option value="Jofré Luján">Jofré Luján</option>
            <option value="Rojas María">Rojas María</option>
            <option value="Rosales Mónica">Rosales Mónica</option>
            <option value="Olivo Cintia">Olivo Cintia</option>
            <option value="Pereira Érica">Pereira Érica</option>
            <option value="Florencia">Florencia</option>
            <option value="Evangelina">Evangelina</option>
          </select>
        </div>

        <div class="form-group">
          <label for="piso">Piso:</label>
          <select id="piso" required>
            <option value="">Seleccione el piso...</option>
            <option value="2">Piso 2</option>
            <option value="3">Piso 3</option>
            <option value="4">Piso 4</option>
            <option value="5">Piso 5</option>
            <option value="6">Piso 6</option>
            <option value="FLOTANTE">FLOTANTE</option>
          </select>
        </div>

        <div class="form-group">
          <label for="habitacion">N° de Habitación:</label>
          <input type="number" id="habitacion" placeholder="Ej: 102" required>
        </div>

        <div class="form-group">
          <label for="novedad">Detalle de la Novedad:</label>
          <textarea id="novedad" placeholder="Describa el problema..." required></textarea>
        </div>

        <button type="submit" class="btn-submit" id="btnEnviar">📤 REGISTRAR NOVEDAD</button>
      </form>

      <div id="mensajeExito" class="alert-success">✔ Novedad registrada con éxito.</div>
    </div>
  </div>

  <script>
    var SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxx8CwidL3qa9-exvHwZCwI_Z06tsdMW8vCggj1gIAgENCOrXjNFUaepy-mIJM9d9FtCg/exec";

    document.getElementById('formMucamas').addEventListener('submit', function(e) {
      e.preventDefault();

      var btn = document.getElementById('btnEnviar');
      btn.innerText = "Cargando...";
      btn.disabled = true;

      var params = new URLSearchParams({
        action: "guardarNovedadMucama",
        mucama: document.getElementById('mucamaNombre').value,
        piso: document.getElementById('piso').value,
        habitacion: document.getElementById('habitacion').value,
        detalle: document.getElementById('novedad').value
      });

      fetch(SCRIPT_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: params
      })
      .then(res => res.json())
      .then(data => {
        btn.innerText = "📤 REGISTRAR NOVEDAD";
        btn.disabled = false;
        document.getElementById('formMucamas').reset();

        var msj = document.getElementById('mensajeExito');
        msj.style.display = 'block';
        setTimeout(() => { msj.style.display = 'none'; }, 3000);
      })
      .catch(err => {
        alert("Error al conectar con el servidor. Intente de nuevo.");
        btn.innerText = "📤 REGISTRAR NOVEDAD";
        btn.disabled = false;
      });
    });
  </script>

  <!-- Registro del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker Registrado'))
          .catch(err => console.log('Error SW:', err));
      });
    }
  </script>
</body>
</html>
